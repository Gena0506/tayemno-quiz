<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170817"><title>TAYEMNO — Чого ти бажаєш?</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#58133e 0%,#1b0b1b 52%,#0a080d 100%);color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:25px 18px 35px}.top{display:flex;justify-content:space-between;color:#ff9fce;font-size:12px;letter-spacing:2px;font-weight:800}.hero{text-align:center;padding:25px 0 19px}.characters{font-size:62px;filter:drop-shadow(0 0 18px #d5277e)}.eyebrow{font-size:11px;color:#ffb0d7;letter-spacing:3px;margin-top:10px}h1{font-size:clamp(35px,9vw,49px);line-height:1.04;margin:11px 0;font-weight:950}h1 span{color:#ff57a9;text-shadow:0 0 24px #ad1e72}.hero p{font-size:14px;color:#eac1d8}.panel{border:1px solid #81365c;background:rgba(49,19,44,.88);border-radius:20px;padding:22px 18px;box-shadow:0 12px 40px #0005}.progress{display:flex;gap:5px;margin:13px 0 23px}.bar{flex:1;height:5px;border-radius:8px;background:#64405a}.bar.on{background:#ff4fa8}.muted{color:#f2a8cf;font-size:12px}.qtitle{font-size:23px;line-height:1.25;margin:7px 0 20px;font-weight:800}.answers{display:grid;gap:10px}button{font:inherit;cursor:pointer}.answer{width:100%;text-align:left;border:1px solid #764260;background:#411b39;color:#fff;border-radius:13px;padding:15px 13px;font-size:15px}.answer.selected{border-color:#ff85c4;background:#82305d}.nav{display:flex;gap:10px;margin-top:21px}.nav button{border-radius:12px;padding:13px;color:#fff;font-weight:700}.back{background:transparent;border:1px solid #845171;flex:1}.next{background:#f03d9b;border:0;flex:2}.next:disabled{background:#6a3a57;cursor:not-allowed}.result{text-align:center}.result .symbol{font-size:54px}.result h2{font-size:23px;color:#ff80c0}.result p{line-height:1.6;color:#f3d2e6}.cta{display:block;background:#f03d9b;color:#fff;text-decoration:none;border-radius:13px;padding:16px;font-weight:800;margin-top:22px}.restart{background:none;border:0;color:#ffb8db;margin-top:17px}.footer{text-align:center;color:#b98ba9;font-size:10px;letter-spacing:1px;margin-top:20px}small{color:#c9a0b8}</style></head><body><main class="wrap"><header class="top"><span>TAYEMNO</span><span>18+</span></header><div class="hero"><div class="characters" aria-hidden="true">🧠 💗</div><div class="eyebrow">ІНТЕРАКТИВНА ГРА</div><h1>ЧОГО ТИ<br><span>БАЖАЄШ?</span></h1><p>5 питань — і ти ближче до свого вибору</p></div><section class="panel" id="content" aria-live="polite"></section><div class="footer">TAYEMNO • ОСОБИСТЕ ЗАЛИШАЄТЬСЯ ОСОБИСТИМ</div></main><script>const questions=[{q:'Що привело тебе до TAYEMNO?',hint:'Бажання вже щось задумало…',a:['✨ Хочу спробувати щось нове','🎁 Шукаю особливий подарунок','🌸 Просто цікавлюся','🔥 Я вже маю досвід']},{q:'Для кого ти обираєш?',hint:'Мозок уточнює деталі.',a:['💗 Для себе','💕 Для нас двох','🎀 Для близької людини','👀 Поки лише дивлюся']},{q:'Що найважливіше?',hint:'Обирай те, що відгукується.',a:['🌷 Простота та комфорт','✨ Нові враження','🛡️ Якість і матеріали','🔒 Приватність']},{q:'Який бюджет комфортний?',hint:'Без тиску — тільки твій вибір.',a:['💸 До 500 грн','💰 500–1000 грн','💎 1000–2000 грн','👑 Понад 2000 грн']},{q:'Яка допомога тобі потрібна?',hint:'Майже готово!',a:['🛍️ Підібрати категорію','📖 Поради для початківців','🎁 Ідеї подарунків','💌 Особиста консультація']}];let step=0,answers=[];const content=document.getElementById('content');function render(){content.replaceChildren();if(step===5){const gift=answers[0]===1||answers[1]===2||answers[4]===2,beginner=answers[0]===2||answers[4]===1;const title=gift?'🎁 МАЙСТЕР ПОДАРУНКІВ':beginner?'🌸 ДОПИТЛИВИЙ ДОСЛІДНИК':answers[0]===3?'🔥 СМІЛИВИЙ ЕКСПЕРИМЕНТАТОР':'💗 ПОЦІНОВУВАЧ КОМФОРТУ';const desc=gift?'Твій напрямок — продумані подарунки. Врахуй вподобання людини та свій бюджет.':beginner?'Тобі підійде знайомство з базовими категоріями, матеріалами та правилами догляду.':answers[0]===3?'Порівнюй характеристики та шукай те, що відповідає твоїм уподобанням.':'Почни з простих у використанні варіантів, приділяючи увагу матеріалам та зручності.';content.innerHTML='<div class="result"><div class="symbol">🎉</div><div class="eyebrow">ТВІЙ РЕЗУЛЬТАТ</div><h2></h2><p></p><small>Рекомендація за відповідями, не психологічна оцінка.</small><a class="cta" href="https://t.me/tayemno_shop_bot" target="_blank" rel="noopener noreferrer">🛍️ ПЕРЕГЛЯНУТИ КАТАЛОГ ↗</a><button class="restart">↻ Пройти ще раз</button></div>';content.querySelector('h2').textContent=title;content.querySelector('p').textContent=desc;content.querySelector('.restart').onclick=()=>{step=0;answers=[];render()};return}const counter=document.createElement('div');counter.className='muted';counter.textContent=`ПИТАННЯ ${step+1} / 5`;content.append(counter);const progress=document.createElement('div');progress.className='progress';for(let i=0;i<5;i++){const b=document.createElement('div');b.className='bar'+(i<=step?' on':'');progress.append(b)}content.append(progress);const hint=document.createElement('div');hint.className='muted';hint.textContent=questions[step].hint;content.append(hint);const title=document.createElement('div');title.className='qtitle';title.textContent=questions[step].q;content.append(title);const choices=document.createElement('div');choices.className='answers';questions[step].a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer'+(answers[step]===i?' selected':'');b.textContent=a+(answers[step]===i?' ✓':'');b.onclick=()=>{answers[step]=i;render()};choices.append(b)});content.append(choices);const nav=document.createElement('div');nav.className='nav';const back=document.createElement('button');back.className='back';back.textContent='← Назад';back.disabled=step===0;back.onclick=()=>{step--;render()};const next=document.createElement('button');next.className='next';next.textContent=step===4?'ПОКАЗАТИ РЕЗУЛЬТАТ':'ДАЛІ →';next.disabled=answers[step]===undefined;next.onclick=()=>{step++;render()};nav.append(back,next);content.append(nav)}render();</script></body></html>
